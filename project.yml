name: MacPhotoStudio
options:
  bundleIdPrefix: com.macphotostudio
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MacPhotoStudio:
    type: application
    platform: macOS
    sources:
      - path: MacPhotoStudio
    entitlements:
      path: MacPhotoStudio/MacPhotoStudio.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macphotostudio.app
        PRODUCT_NAME: MacPhotoStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mac Photo Studio
        CODE_SIGN_ENTITLEMENTS: MacPhotoStudio/MacPhotoStudio.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - sdk: libsqlite3.tbd
  MacPhotoStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacPhotoStudioTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macphotostudio.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: MacPhotoStudio
