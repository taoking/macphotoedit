name: macOS Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "plan.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select supported Xcode
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Run unit tests
        run: |
          xcodegen generate
          git diff --exit-code -- MacPhotoStudio.xcodeproj/project.pbxproj
          xcodebuild \
            -project MacPhotoStudio.xcodeproj \
            -scheme MacPhotoStudio \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build Debug app
        run: |
          xcodegen generate
          git diff --exit-code -- MacPhotoStudio.xcodeproj/project.pbxproj
          xcodebuild \
            -project MacPhotoStudio.xcodeproj \
            -scheme MacPhotoStudio \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
