name: macOS Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "plan.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select supported Xcode
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Run unit tests
        run: |
          xcodegen generate
          xcodebuild \
            -project MacPhotoStudio.xcodeproj \
            -scheme MacPhotoStudio \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build Debug app
        run: |
          xcodegen generate
          xcodebuild \
            -project MacPhotoStudio.xcodeproj \
            -scheme MacPhotoStudio \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
